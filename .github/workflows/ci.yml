name: CI

on:
  push:
    branches: [main, gesture-control]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Type checking
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Repository tests + coverage 80%
        run: node --test --experimental-test-coverage --test-coverage-lines=80 tests/repository-quality.test.mjs
      - name: Build
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python type checker
        run: python -m pip install "mypy>=1.18,<2"
      - name: Python type checking
        run: mypy api --config-file mypy.ini
      - run: python -m compileall api
      - name: Validate Docker image
        run: docker build -t gesture-control-ci .

  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Windows companion
        run: dotnet build windows-agent/GestureControl.Windows.csproj -c Release
